name: Credential scan
on:
  push:
  pull_request:

jobs:
  tracked-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject common hard-coded credentials
        shell: bash
        run: |
          if git grep -IqE 'AIza[[:alnum:]_-]{20,}|-----BEGIN (RSA |EC )?PRIVATE KEY-----|sk_(live|test)_[[:alnum:]]+'; then
            echo "A tracked file contains a credential-shaped value. Check locally before pushing."
            exit 1
          fi
