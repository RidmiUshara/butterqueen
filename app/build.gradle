plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

// Values needed at build time stay in Android Studio's ignored local.properties.
def localConfig = new Properties()
def localConfigFile = rootProject.file('local.properties')
if (localConfigFile.exists()) {
    localConfigFile.withInputStream { stream -> localConfig.load(stream) }
}
def mapsApiKey = localConfig.getProperty('MAPS_API_KEY', '').trim()
def payHereMerchantId = localConfig.getProperty('PAYHERE_MERCHANT_ID', '').trim()
if (payHereMerchantId && !(payHereMerchantId ==~ /[0-9]+/)) {
    throw new GradleException('PAYHERE_MERCHANT_ID must contain digits only')
}

android {
    namespace 'lk.jiat.butterqueen'
    compileSdk 36

    defaultConfig {
        applicationId "lk.jiat.butterqueen"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0"

        manifestPlaceholders = [MAPS_API_KEY: mapsApiKey]
        buildConfigField "String", "PAYHERE_MERCHANT_ID", '"'+payHereMerchantId+'"'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation libs.picasso
    implementation libs.glide

    implementation 'androidx.cardview:cardview:1.0.0'

    compileOnly "org.projectlombok:lombok:1.18.44"
    annotationProcessor "org.projectlombok:lombok:1.18.44"

    implementation 'com.github.PayHereDevs:payhere-android-sdk:v3.0.18'
    implementation 'androidx.appcompat:appcompat:1.6.0'
    implementation 'com.google.code.gson:gson:2.8.0'


    implementation platform("com.google.firebase:firebase-bom:34.11.0")
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-firestore"
    implementation "com.google.firebase:firebase-storage"

    implementation "com.google.android.gms:play-services-maps:20.0.0"
    implementation "com.google.maps.android:android-maps-utils:4.0.0"
    implementation "com.stripe:stripe-android:23.1.0"
}